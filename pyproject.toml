[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uavplanner"
version = "0.1.0"
description = "UAV-LiDAR flight-line planner"
requires-python = ">=3.10"
dependencies = ["shapely", "pyproj", "simplekml"]

[project.scripts]
uavplanner = "uavplanner.cli:main"

[tool.setuptools]
packages = ["uavplanner"]
